<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
      font-size: 13px;
      background: #0a0e27;
      color: #00ff9f;
      background-image: 
        linear-gradient(rgba(0, 255, 159, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 159, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      animation: scanline 8s linear infinite;
    }
    
    @keyframes scanline {
      0% { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }
    
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 5px currentColor, 0 0 10px currentColor; }
      50% { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor; }
    }
    
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 5px currentColor, inset 0 0 5px rgba(0, 255, 159, 0.1); }
      50% { box-shadow: 0 0 20px currentColor, 0 0 30px currentColor, inset 0 0 10px rgba(0, 255, 159, 0.2); }
    }
    
    .domain-badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(255, 0, 255, 0.1);
      border: 1px solid #ff00ff;
      border-radius: 4px;
      font-size: 11px;
      color: #ff00ff;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
      animation: pulse 3s ease-in-out infinite;
    }
    
    .query-section {
      margin-bottom: 20px;
    }
    
    .query-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 13px;
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #00ffff;
      border-radius: 4px;
      margin-bottom: 12px;
      color: #00ffff;
      transition: all 0.3s;
    }
    
    .query-input::placeholder {
      color: rgba(0, 255, 255, 0.4);
    }
    
    .query-input:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.1);
      background: rgba(0, 255, 255, 0.08);
    }
    
    .submit-button {
      width: 100%;
      padding: 12px 24px;
      background: linear-gradient(135deg, rgba(0, 255, 159, 0.2), rgba(0, 255, 255, 0.2));
      color: #00ff9f;
      border: 2px solid #00ff9f;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    
    .submit-button:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(0, 255, 159, 0.3), rgba(0, 255, 255, 0.3));
      box-shadow: 0 0 20px rgba(0, 255, 159, 0.6), inset 0 0 20px rgba(0, 255, 159, 0.2);
      transform: translateY(-2px);
    }
    
    .submit-button:disabled {
      background: rgba(100, 100, 100, 0.2);
      border-color: #555;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    .answer-section {
      display: none;
      margin-top: 24px;
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .answer-section.show {
      display: block;
    }
    
    .answer-header {
      font-size: 11px;
      font-weight: 700;
      color: #ff00ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-shadow: 0 0 10px #ff00ff;
    }
    
    .answer-content {
      padding: 20px;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid rgba(0, 255, 159, 0.3);
      border-radius: 4px;
      line-height: 1.8;
      color: #c0c0c0;
      box-shadow: 0 0 15px rgba(0, 255, 159, 0.2);
    }
    
    #answer-text h1,
    #answer-text h2,
    #answer-text h3,
    #answer-text h4 {
      margin-top: 20px;
      margin-bottom: 12px;
      font-weight: 700;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    
    #answer-text h1 {
      font-size: 18px;
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      padding-bottom: 8px;
    }
    
    #answer-text h2 {
      font-size: 16px;
      color: #ff00ff;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
    }
    
    #answer-text h3 {
      font-size: 14px;
      color: #00ff9f;
      text-shadow: 0 0 10px rgba(0, 255, 159, 0.5);
    }
    
    #answer-text h4 {
      font-size: 13px;
      color: #ffff00;
      text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
    }
    
    #answer-text p {
      margin: 12px 0;
      color: #c0c0c0;
    }
    
    #answer-text ul,
    #answer-text ol {
      margin: 12px 0;
      padding-left: 30px;
    }
    
    #answer-text li {
      margin: 8px 0;
      color: #c0c0c0;
    }
    
    #answer-text li::marker {
      color: #00ff9f;
    }
    
    #answer-text strong {
      font-weight: 700;
      color: #00ffff;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
    }
    
    #answer-text em {
      font-style: italic;
      color: #ff00ff;
    }
    
    #answer-text code {
      background: rgba(255, 0, 255, 0.1);
      padding: 3px 8px;
      border-radius: 3px;
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
      font-size: 12px;
      color: #ff00ff;
      border: 1px solid rgba(255, 0, 255, 0.3);
    }
    
    #answer-text pre {
      background: rgba(0, 0, 0, 0.5);
      padding: 16px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 16px 0;
      border: 1px solid rgba(0, 255, 159, 0.3);
      box-shadow: inset 0 0 10px rgba(0, 255, 159, 0.1);
    }
    
    #answer-text pre code {
      background: none;
      padding: 0;
      border: none;
      color: #00ff9f;
    }
    
    #answer-text blockquote {
      margin: 16px 0;
      padding-left: 16px;
      border-left: 3px solid #ff00ff;
      color: #aaa;
      font-style: italic;
    }
    
    #answer-text a {
      color: #00ffff;
      text-decoration: none;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
      border-bottom: 1px dotted rgba(0, 255, 255, 0.5);
      transition: all 0.3s;
    }
    
    #answer-text a:hover {
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
      border-bottom: 1px solid #00ffff;
    }
    
    .citations-container {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(0, 255, 255, 0.2);
    }
    
    .citation-link {
      display: inline-block;
      color: #00ffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      margin-right: 12px;
      margin-bottom: 8px;
      padding: 4px 8px;
      border: 1px solid #00ffff;
      border-radius: 3px;
      background: rgba(0, 255, 255, 0.05);
      transition: all 0.3s;
    }
    
    .citation-link:hover {
      background: rgba(0, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    
    .citation-link::before {
      content: "[";
      color: #ff00ff;
    }
    
    .citation-link::after {
      content: "]";
      color: #ff00ff;
    }
    
    .loading-text {
      color: #ffff00;
      font-style: italic;
      animation: glow 2s ease-in-out infinite;
    }
    
    .error-text {
      color: #ff0066;
      padding: 16px;
      background: rgba(255, 0, 102, 0.1);
      border-radius: 4px;
      border: 1px solid #ff0066;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.3);
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 255, 159, 0.2);
    }
    
    .logo-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ff6b4a;
      text-transform: uppercase;
      text-shadow: 
        2px 0 0 #ff6b4a,
        -2px 0 0 #ff6b4a,
        0 2px 0 #ff6b4a,
        0 -2px 0 #ff6b4a,
        2px 2px 0 rgba(0, 0, 0, 0.8),
        3px 3px 0 rgba(0, 0, 0, 0.6),
        0 0 20px rgba(255, 107, 74, 0.6);
      position: relative;
      display: inline-block;
      padding: 4px 8px;
      background: 
        linear-gradient(90deg, 
          transparent 0%, 
          transparent 25%, 
          rgba(255, 107, 74, 0.1) 25%, 
          rgba(255, 107, 74, 0.1) 50%, 
          transparent 50%, 
          transparent 75%, 
          rgba(255, 107, 74, 0.1) 75%);
      background-size: 4px 4px;
      animation: logoGlow 3s ease-in-out infinite;
    }
    
    @keyframes logoGlow {
      0%, 100% { 
        filter: brightness(1);
        text-shadow: 
          2px 0 0 #ff6b4a,
          -2px 0 0 #ff6b4a,
          0 2px 0 #ff6b4a,
          0 -2px 0 #ff6b4a,
          2px 2px 0 rgba(0, 0, 0, 0.8),
          3px 3px 0 rgba(0, 0, 0, 0.6),
          0 0 20px rgba(255, 107, 74, 0.6);
      }
      50% { 
        filter: brightness(1.2);
        text-shadow: 
          2px 0 0 #ff6b4a,
          -2px 0 0 #ff6b4a,
          0 2px 0 #ff6b4a,
          0 -2px 0 #ff6b4a,
          2px 2px 0 rgba(0, 0, 0, 0.8),
          3px 3px 0 rgba(0, 0, 0, 0.6),
          0 0 30px rgba(255, 107, 74, 0.8),
          0 0 40px rgba(255, 107, 74, 0.6);
      }
    }
    
    .logo-subtitle {
      font-size: 9px;
      color: #00ff9f;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      opacity: 0.7;
      text-shadow: 0 0 5px rgba(0, 255, 159, 0.5);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-text">DOC.AI</div>
    <div class="logo-subtitle">Documentation Assistant</div>
  </div>
  
  <div class="domain-badge" id="domain-display">Loading...</div>
  
  <div class="query-section">
    <input 
      type="text" 
      id="query-input" 
      class="query-input" 
      placeholder="Ask a question about this documentation..."
    />
    <button id="submit-button" class="submit-button">Ask</button>
  </div>
  
  <div id="answer-section" class="answer-section">
    <div class="answer-header">Answer</div>
    <div id="answer-content" class="answer-content">
      <div id="answer-text"></div>
      <div id="citations-container" class="citations-container"></div>
    </div>
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
