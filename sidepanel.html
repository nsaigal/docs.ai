<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      background: #ffffff;
      color: #1e293b;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 100vh;
    }
    .content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
    }
    .escalation-wrapper {
      margin-top: auto;
      padding: 0 24px 24px;
      box-sizing: border-box;
      width: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    
    .domain-badge {
      display: inline-block;
      padding: 6px 12px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 20px;
    }
    
    .query-section {
      margin-bottom: 20px;
    }
    
    .query-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 24px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      margin-bottom: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: border-color 0.2s;
    }
    
    .query-input:focus {
      outline: none;
      border-color: #139c53;
    }
    
    .submit-button {
      width: 100%;
      padding: 12px 24px;
      background: #139c53;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background 0.2s;
    }
    
    .submit-button:hover:not(:disabled) {
      background: #0d7a3f;
    }
    
    .submit-button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    
    .answer-section {
      display: none;
      margin-top: 24px;
    }
    
    .answer-section.show {
      display: block;
    }
    
    .answer-header {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    
    .answer-content {
      padding: 20px;
      background: #f8fafc;
      border-radius: 8px;
      line-height: 1.6;
      color: #1e293b;
    }
    
    #answer-text h1,
    #answer-text h2,
    #answer-text h3,
    #answer-text h4 {
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 600;
      color: #0f172a;
    }
    
    #answer-text h1 {
      font-size: 20px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    
    #answer-text h2 {
      font-size: 18px;
    }
    
    #answer-text h3 {
      font-size: 16px;
    }
    
    #answer-text h4 {
      font-size: 15px;
    }
    
    #answer-text p {
      margin: 12px 0;
    }
    
    #answer-text ul,
    #answer-text ol {
      margin: 12px 0;
      padding-left: 24px;
    }
    
    #answer-text li {
      margin: 6px 0;
    }
    
    #answer-text strong {
      font-weight: 600;
      color: #0f172a;
    }
    
    #answer-text em {
      font-style: italic;
    }
    
    #answer-text code {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      color: #1e293b;
    }
    
    #answer-text pre {
      background: #e2e8f0;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 12px 0;
    }
    
    #answer-text pre code {
      background: none;
      padding: 0;
    }
    
    #answer-text blockquote {
      margin: 12px 0;
      padding-left: 16px;
      border-left: 3px solid #139c53;
      color: #64748b;
      font-style: italic;
    }
    
    #answer-text a {
      color: #139c53;
      text-decoration: none;
    }
    
    #answer-text a:hover {
      text-decoration: underline;
    }
    
    .citations-container {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }
    
    .citation-link {
      display: inline-block;
      color: #139c53;
      text-decoration: none;
      font-size: 14px;
      margin-right: 16px;
      margin-bottom: 8px;
      transition: color 0.2s;
    }
    
    .citation-link:hover {
      color: #0d7a3f;
      text-decoration: underline;
    }
    
    .citation-link::before {
      content: "[";
      color: #64748b;
    }
    #escalate {
      margin-top: 0;
      width: auto;
      padding: 12px 20px;
      background-color: #f25c54;
      font-size: 15px;
      border-radius: 12px;
    }
    #escalate:hover {
      background-color: #d9443d;
    }
    
    .citation-link::after {
      content: "]";
      color: #64748b;
    }
    
    .loading-text {
      color: #64748b;
      font-style: italic;
    }
    
    .error-text {
      color: #dc2626;
      padding: 16px;
      background: #fef2f2;
      border-radius: 8px;
      border: 1px solid #fecaca;
    }
    .escalation-card {
      display: none;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      padding: 32px;
      background-color: #fff8f6;
      gap: 24px;
      align-items: stretch;
      justify-content: flex-start;
      width: 100%;
      min-height: 200px;
      box-sizing: border-box;
      align-self: stretch;
      flex-direction: column;
    }
    .escalation-card.visible {
      display: flex;
    }
    .escalation-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .escalation-title {
      font-weight: 700;
      color: #1e1e1e;
      font-size: 18px;
    }
    .escalation-description {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
    }
    .avatar-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }
    .speech-bubble {
      position: relative;
      background: #fff;
      border: 2px solid #f25c54;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 14px;
      color: #1e1e1e;
      line-height: 1.5;
      max-width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 48px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-left: 2px solid #f25c54;
      border-bottom: 2px solid #f25c54;
      transform: rotate(45deg);
    }
    .avatar-player {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18);
    }
    .avatar-player video,
    .avatar-player iframe {
      width: 100%;
      height: 220px;
      display: block;
      object-fit: cover;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="domain-badge" id="domain-display">Loading...</div>
  
  <div class="query-section">
    <input 
      type="text" 
      id="query-input" 
      class="query-input" 
      placeholder="Ask a question about this documentation..."
    />
    <button id="submit-button" class="submit-button">Ask</button>
  </div>
  
  <div id="answer-section" class="answer-section">
    <div class="answer-header">Answer</div>
    <div id="answer-content" class="answer-content">
      <div id="answer-text"></div>
      <div id="citations-container" class="citations-container"></div>
    </div>
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
