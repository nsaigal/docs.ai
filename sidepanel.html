<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      width: 100%;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #1e293b;
      font-size: 15px;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    h1 {
      font-size: 22px;
      margin: 0;
      color: #0f172a;
      font-weight: 700;
    }
    .domain-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #f1f5f9;
      border-radius: 999px;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      align-self: flex-start;
    }
    .domain-badge::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .query-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .query-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }
    .query-input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15);
    }
    .submit-button {
      width: 100%;
      padding: 14px 18px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .submit-button:hover:not(:disabled) {
      background: #1557b0;
    }
    .submit-button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    .secondary {
      background: #f25c54;
      color: #ffffff;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      width: auto;
    }
    .secondary:hover {
      background: #d9443d;
    }
    .theme-toggle {
      background: transparent;
      color: #334155;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .theme-toggle:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
    .logo-container {
      display: none;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.1);
    }
    .logo-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ff6b4a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      padding: 4px 8px;
    }
    .logo-subtitle {
      font-size: 11px;
      color: #475569;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      opacity: 0.7;
      font-weight: 600;
    }
    body.dark-mode {
      background: #0a0e27;
      color: #00ff9f;
      background-image:
        linear-gradient(rgba(0, 255, 159, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 159, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', 'Monaco', 'Cascadia Code', 'Courier New', monospace;
      font-size: 13px;
    }
    body.dark-mode .content {
      gap: 20px;
    }
    body.dark-mode .header h1 {
      color: #00ffff;
    }
    body.dark-mode .domain-badge {
      background: rgba(255, 0, 255, 0.1);
      border: 1px solid #ff00ff;
      color: #ff00ff;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
    }
    body.dark-mode .domain-badge::before {
      background: #ff00ff;
    }
    body.dark-mode .query-input {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #00ffff;
      color: #00ffff;
    }
    body.dark-mode .query-input::placeholder {
      color: rgba(0, 255, 255, 0.4);
    }
    body.dark-mode .query-input:focus {
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.1);
      background: rgba(0, 255, 255, 0.08);
    }
    body.dark-mode .submit-button {
      background: linear-gradient(135deg, rgba(0, 255, 159, 0.2), rgba(0, 255, 255, 0.2));
      color: #00ff9f;
      border: 2px solid #00ff9f;
      border-radius: 8px;
    }
    body.dark-mode .submit-button:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(0, 255, 159, 0.3), rgba(0, 255, 255, 0.3));
      box-shadow: 0 0 20px rgba(0, 255, 159, 0.6), inset 0 0 20px rgba(0, 255, 159, 0.2);
      transform: translateY(-1px);
    }
    body.dark-mode .answer-section {
      margin-top: 24px;
    }
    body.dark-mode .answer-header {
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
      letter-spacing: 2px;
    }
    body.dark-mode .answer-content {
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid rgba(0, 255, 159, 0.3);
      color: #c0c0c0;
      box-shadow: 0 0 15px rgba(0, 255, 159, 0.2);
    }
    body.dark-mode #answer-text h1,
    body.dark-mode #answer-text h2,
    body.dark-mode #answer-text h3,
    body.dark-mode #answer-text h4 {
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    body.dark-mode #answer-text h2 {
      color: #ff00ff;
    }
    body.dark-mode #answer-text h3 {
      color: #00ff9f;
    }
    body.dark-mode #answer-text h4 {
      color: #ffff00;
    }
    body.dark-mode #answer-text p,
    body.dark-mode #answer-text li {
      color: #c0c0c0;
    }
    body.dark-mode #answer-text strong {
      color: #00ffff;
    }
    body.dark-mode #answer-text em {
      color: #ff00ff;
    }
    body.dark-mode #answer-text code {
      background: rgba(255, 0, 255, 0.1);
      border: 1px solid rgba(255, 0, 255, 0.3);
      color: #ff00ff;
    }
    body.dark-mode #answer-text pre {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 159, 0.3);
      box-shadow: inset 0 0 10px rgba(0, 255, 159, 0.1);
    }
    body.dark-mode #answer-text pre code {
      color: #00ff9f;
    }
    body.dark-mode #answer-text blockquote {
      border-left: 3px solid #ff00ff;
      color: #aaa;
    }
    body.dark-mode #answer-text a {
      color: #00ffff;
      border-bottom: 1px dotted rgba(0, 255, 255, 0.5);
    }
    body.dark-mode #answer-text a:hover {
      border-bottom: 1px solid #00ffff;
    }
    body.dark-mode .citations-container {
      border-top: 1px solid rgba(0, 255, 255, 0.2);
    }
    body.dark-mode .citation-link {
      color: #00ffff;
      border: 1px solid #00ffff;
      background: rgba(0, 255, 255, 0.05);
    }
    body.dark-mode .citation-link:hover {
      background: rgba(0, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }
    body.dark-mode .loading-text {
      color: #ffff00;
    }
    body.dark-mode .error-text {
      color: #ff0066;
      background: rgba(255, 0, 102, 0.1);
      border: 1px solid #ff0066;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.3);
    }
    body.dark-mode .theme-toggle {
      color: #00ff9f;
      border-color: rgba(0, 255, 159, 0.4);
      background: rgba(0, 255, 159, 0.08);
    }
    body.dark-mode .theme-toggle:hover {
      background: rgba(0, 255, 159, 0.15);
      border-color: rgba(0, 255, 159, 0.7);
    }
    body.dark-mode .header-actions {
      gap: 12px;
    }
    body.dark-mode .escalation-card {
      background-color: rgba(10, 20, 40, 0.85);
      border: 1px solid rgba(0, 255, 159, 0.3);
      color: #e2e8f0;
    }
    body.dark-mode .speech-bubble {
      background: rgba(10, 20, 40, 0.9);
      border: 2px solid #f25c54;
      color: #f8fafc;
    }
    body.dark-mode .speech-bubble::after {
      background: rgba(10, 20, 40, 0.9);
      border-color: #f25c54;
    }
    body.dark-mode .avatar-player {
      background: rgba(0, 0, 0, 0.85);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
    }
    .logo-container.active,
    body.dark-mode .logo-container {
      display: block;
      border-color: rgba(0, 255, 159, 0.2);
    }
    .logo-container.active .logo-text,
    body.dark-mode .logo-text {
      color: #ff6b4a;
      text-shadow:
        2px 0 0 #ff6b4a,
        -2px 0 0 #ff6b4a,
        0 2px 0 #ff6b4a,
        0 -2px 0 #ff6b4a,
        2px 2px 0 rgba(0, 0, 0, 0.8);
    }
    .logo-container.active .logo-subtitle,
    body.dark-mode .logo-subtitle {
      color: #00ff9f;
      text-shadow: 0 0 5px rgba(0, 255, 159, 0.5);
    }
    .answer-section {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .answer-section.show {
      display: flex;
    }
    .answer-header {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .answer-content {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      line-height: 1.6;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }
    #answer-text h1,
    #answer-text h2,
    #answer-text h3,
    #answer-text h4 {
      margin-top: 16px;
      margin-bottom: 10px;
      font-weight: 600;
      color: #0f172a;
    }
    #answer-text h1 {
      font-size: 20px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    #answer-text h2 {
      font-size: 18px;
    }
    #answer-text h3 {
      font-size: 16px;
    }
    #answer-text h4 {
      font-size: 15px;
    }
    #answer-text p {
      margin: 12px 0;
    }
    #answer-text ul,
    #answer-text ol {
      margin: 12px 0;
      padding-left: 24px;
    }
    #answer-text li {
      margin: 6px 0;
    }
    #answer-text code {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
    }
    #answer-text pre {
      background: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 12px 0;
    }
    #answer-text blockquote {
      margin: 12px 0;
      padding-left: 16px;
      border-left: 3px solid #1a73e8;
      color: #334155;
      font-style: italic;
    }
    #answer-text a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 600;
    }
    #answer-text a:hover {
      text-decoration: underline;
    }
    .citations-container {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .citation-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      color: #1a73e8;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .citation-link:hover {
      background: #1a73e8;
      color: #ffffff;
    }
    .loading-text {
      color: #64748b;
      font-style: italic;
    }
    .error-text {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 14px;
      border-radius: 10px;
    }
    .escalation-wrapper {
      margin-top: auto;
      padding: 0 24px 24px;
      box-sizing: border-box;
      width: 100%;
    }
    .escalation-card {
      display: none;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      padding: 32px;
      background-color: #fff8f6;
      gap: 24px;
      align-items: stretch;
      justify-content: flex-start;
      width: 100%;
      min-height: 200px;
      box-sizing: border-box;
      align-self: stretch;
      flex-direction: column;
    }
    .escalation-card.visible {
      display: flex;
    }
    .escalation-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .escalation-title {
      font-weight: 700;
      color: #1e1e1e;
      font-size: 18px;
    }
    .escalation-description {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
    }
    .avatar-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }
    .speech-bubble {
      position: relative;
      background: #fff;
      border: 2px solid #f25c54;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 14px;
      color: #1e1e1e;
      line-height: 1.5;
      max-width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 48px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-left: 2px solid #f25c54;
      border-bottom: 2px solid #f25c54;
      transform: rotate(45deg);
    }
    .avatar-player {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18);
    }
    .avatar-player video,
    .avatar-player iframe {
      width: 100%;
      height: 220px;
      display: block;
      object-fit: cover;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="header">
      <h1>Documentation Assistant</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-pressed="false">Enable Neon UI</button>
        <button id="escalate" class="secondary">Tavus Escalation</button>
      </div>
    </div>

    <div id="logo-container" class="logo-container" aria-hidden="true">
      <div class="logo-text">DOC.AI</div>
      <div class="logo-subtitle">Documentation Assistant</div>
    </div>

    <div class="domain-badge" id="domain-display">Loading...</div>

    <div class="query-section">
      <input
        type="text"
        id="query-input"
        class="query-input"
        placeholder="Ask a question about this page..."
      />
      <button id="submit-button" class="submit-button">Ask</button>
    </div>

    <div id="answer-section" class="answer-section">
      <div class="answer-header">Answer</div>
      <div id="answer-content" class="answer-content">
        <div id="answer-text"></div>
        <div id="citations-container" class="citations-container"></div>
      </div>
    </div>
  </div>

  <div class="escalation-wrapper">
    <div id="escalation-card" class="escalation-card">
      <div class="escalation-header">
        <div class="escalation-title">Tavus Support Bridge</div>
        <div class="escalation-description">Escalation channel primed. This demo uses a Tavus avatar feed responding to the debugging prompt below.</div>
      </div>
      <div class="avatar-section">
        <div class="speech-bubble" id="tavus-transcript">Loading Tavus response...</div>
        <div class="avatar-player">
          <video id="tavus-video" src="https://storage.googleapis.com/tavus-public-assets/demos/riya-debugging.mp4" poster="https://storage.googleapis.com/tavus-public-assets/demos/riya-poster.jpg" playsinline autoplay muted loop></video>
        </div>
      </div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
